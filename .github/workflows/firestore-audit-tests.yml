name: Firestore Audit Tests

# Test dello script di audit in sola lettura, sul Firestore Emulator.
# Nessun accesso a progetti reali, nessun segreto, nessun deploy.
on:
  push:
    paths:
      - 'firebase/audit/**'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-audit-tests.yml'
  pull_request:
    paths:
      - 'firebase/audit/**'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    name: Audit Firestore · test emulatore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase/audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/audit/package-lock.json

      # Il Firestore Emulator richiede Java 21.
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installazione riproducibile dal lockfile versionato.
      - name: Dipendenze (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Versioni
        run: |
          node --version
          npx firebase --version
          npm ls --depth=0

      - name: Controllo sintassi
        run: npm run check

      - name: Test audit (Firestore Emulator)
        run: npm test

  # Credenziali impersonate con Firebase Admin SDK, contro endpoint Google simulati in
  # locale: nessuna richiesta lascia il runner (i nomi Google puntano a 127.0.0.1).
  credentials-e2e:
    name: Audit Firestore · credenziali impersonate (Google simulato)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/audit/package-lock.json

      - name: Dipendenze (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Script IAM (shellcheck e sintassi)
        working-directory: firebase/audit/iam
        run: |
          shellcheck -S warning 01-verifica.sh 02-configura.sh 03-prova-impersonazione.sh
          shellcheck -S warning test-stubs/gcloud test-stubs/curl
          PYTHONDONTWRITEBYTECODE=1 python3 -c "import ast,sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]" analizza.py permessi.py prova_permessi.py

      - name: Test script IAM (gcloud e curl simulati)
        working-directory: firebase/audit/iam
        run: node --test --test-reporter=spec iam-scripts.test.mjs

      - name: Nomi Google verso 127.0.0.1
        run: |
          set -euo pipefail
          echo "127.0.0.1 oauth2.googleapis.com www.googleapis.com accounts.google.com sts.googleapis.com iamcredentials.googleapis.com cloudresourcemanager.googleapis.com firestore.googleapis.com" | sudo tee -a /etc/hosts
          getent hosts firestore.googleapis.com

      - name: Test credenziali impersonate
        env:
          E2E_FAKE_GOOGLE: '1'
        run: sudo -E env "PATH=$PATH" E2E_FAKE_GOOGLE=1 node --test --test-reporter=spec credentials.e2e.test.mjs
