name: Firestore Audit Tests

# Test dello script di audit in sola lettura, sul Firestore Emulator.
# Nessun accesso a progetti reali, nessun segreto, nessun deploy.
on:
  push:
    paths:
      - 'firebase/audit/**'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-audit-tests.yml'
  pull_request:
    paths:
      - 'firebase/audit/**'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    name: Audit Firestore · test emulatore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase/audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/audit/package-lock.json

      # Il Firestore Emulator richiede Java 21.
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installazione riproducibile dal lockfile versionato.
      - name: Dipendenze (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Versioni
        run: |
          node --version
          npx firebase --version
          npm ls --depth=0

      - name: Controllo sintassi
        run: npm run check

      - name: Test audit (Firestore Emulator)
        run: npm test
