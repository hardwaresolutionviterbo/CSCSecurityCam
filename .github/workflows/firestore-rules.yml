name: Firestore Rules

# Test permanenti delle regole Firestore con il Firestore Emulator.
# Nessun deploy e nessun accesso a progetti reali: il progetto "demo-" è solo locale.
on:
  push:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    name: Regole Firestore · test emulatore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase/tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Il Firestore Emulator richiede Java 21.
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache emulatori Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/tests/package-lock.json', 'firebase/tests/package.json') }}

      - name: Dipendenze
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json assente: installazione iniziale per generarlo."
            npm install --no-audit --no-fund
          fi

      - name: Carica lockfile generato
        if: hashFiles('firebase/tests/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: firestore-tests-lockfile
          path: |
            firebase/tests/package.json
            firebase/tests/package-lock.json
          retention-days: 7

      - name: Versioni
        run: |
          node --version
          java -version 2>&1 | head -1
          npx firebase --version
          npm ls --depth=0

      - name: Controllo sintassi
        run: node --check rules.test.mjs

      - name: Test regole (Firestore Emulator)
        env:
          RULES_COVERAGE_FILE: ${{ github.workspace }}/rules-coverage.json
        run: npm test

      # Diagnostica temporanea: lockfile e copertura nel log, compressi in base64.
      - name: Diagnostica (lockfile e copertura)
        if: always()
        run: |
          for f in package-lock.json ../../rules-coverage.json; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            echo "BEGIN $(basename "$f")"
            gzip -9c "$f" | base64 -w 200
            echo "END $(basename "$f")"
            echo "::endgroup::"
          done

      - name: Carica report di copertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-coverage
          path: |
            rules-coverage.json
            rules-coverage.html
          if-no-files-found: ignore
          retention-days: 14
