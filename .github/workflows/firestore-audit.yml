name: Firestore Audit (produzione, sola lettura)

# Audit dei dati del progetto Firebase reale, SOLO LETTURA, avviato solo a mano.
# Nessuna scrittura, nessuna correzione, nessun deploy. Istruzioni: firebase/audit/README.md
#
# Credenziali: SOLO Workload Identity Federation, senza chiavi permanenti. Variabili del
# repository (Settings → Secrets and variables → Actions → Variables):
#   FIREBASE_AUDIT_WIF_PROVIDER     projects/<numero>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   FIREBASE_AUDIT_SERVICE_ACCOUNT  firestore-audit@nexus-social-e3eee.iam.gserviceaccount.com
# L'account di servizio deve avere SOLO il ruolo "Cloud Datastore Viewer"; lo script
# verifica identità e permessi effettivi e si ferma se trova permessi di scrittura.
# Le chiavi JSON non sono supportate.
on:
  workflow_dispatch:
    inputs:
      conferma_progetto:
        description: "Scrivi l'id del progetto da verificare (nexus-social-e3eee)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit Firestore · sola lettura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ambiente GitHub dedicato: si possono richiedere approvatori prima dell'avvio.
    environment: firestore-audit
    env:
      PROJECT_ID: nexus-social-e3eee
    defaults:
      run:
        working-directory: firebase/audit

    steps:
      - name: Conferma del progetto
        working-directory: .
        env:
          CONFERMA: ${{ inputs.conferma_progetto }}
        run: |
          set -euo pipefail
          if [ "${CONFERMA}" != "${PROJECT_ID}" ]; then
            echo "::error::Conferma non valida: scrivi esattamente ${PROJECT_ID}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/audit/package-lock.json

      - name: Dipendenze (npm ci)
        run: npm ci --no-audit --no-fund --omit=dev

      - name: Configurazione Workload Identity presente
        working-directory: .
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_AUDIT_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.FIREBASE_AUDIT_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${WIF_PROVIDER}" ] || [ -z "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "::error::Workload Identity non configurata (FIREBASE_AUDIT_WIF_PROVIDER, FIREBASE_AUDIT_SERVICE_ACCOUNT). Le chiavi JSON non sono supportate."
            exit 1
          fi

      # Credenziali temporanee: file external_account che impersona l'account di sola lettura.
      - name: Credenziali Google (Workload Identity, senza chiavi)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_AUDIT_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_AUDIT_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Audit in sola lettura
        id: audit
        run: |
          set -uo pipefail
          mkdir -p reports
          node audit-firestore.mjs --project "${PROJECT_ID}" --out reports/firestore-audit.json > reports/riepilogo.txt
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # Il riepilogo contiene solo conteggi e codici di anomalia.
          {
            echo '```'
            cat reports/riepilogo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat reports/riepilogo.txt
          exit 0

      - name: Carica report anonimo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-audit-report
          path: |
            firebase/audit/reports/firestore-audit.json
            firebase/audit/reports/riepilogo.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Esito
        run: |
          case "${{ steps.audit.outputs.code }}" in
            0)  echo "Esito: PASS" ;;
            10) echo "::warning::Esito: PASS CON AVVISI" ;;
            20) echo "::error::Esito: BLOCKED (anomalie bloccanti)"; exit 1 ;;
            30) echo "::error::Esito: INCOMPLETO (letture parziali o database non analizzati)"; exit 1 ;;
            2)  echo "::error::Verifica preliminare non superata (progetto, identità, permessi o database): nessun dato letto"; exit 1 ;;
            *)  echo "::error::Errore durante l'audit"; exit 1 ;;
          esac
