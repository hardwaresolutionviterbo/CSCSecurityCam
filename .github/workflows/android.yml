name: Import ZIP and build Android APK

on:
  push:
    branches:
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    name: Import supplied source and build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_ZIP_URL: https://assets.macaly-user-data.dev/hg98xk8o5j3v8rmof6myf280/z175gf7fx1pb9fy8xrdvciuq/bKRVDf2RvSdhSwFJyFu_w/cscsecuritycam-OgjQaPkb.zip
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Download and extract the original project ZIP
        run: |
          curl --fail --location --retry 3 --output /tmp/cscsecuritycam.zip "$SOURCE_ZIP_URL"
          unzip -t /tmp/cscsecuritycam.zip
          unzip -o /tmp/cscsecuritycam.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Commit imported project to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import original CSCSecurityCam project ZIP"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSCSecurityCam-debug-imported
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
