name: Import CSCSecurityCam Android source and build APK

on:
  push:
    branches:
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Finalize compact CSCSecurityCam import' }}
    name: Import Android source and build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Reassemble and extract Android source archive
        run: |
          test -d .import
          test -n "$(find .import -maxdepth 1 -name 'chunk-*.b64' -print -quit)"
          cat .import/chunk-*.b64 > /tmp/cscsecuritycam.tar.xz.b64
          base64 --decode /tmp/cscsecuritycam.tar.xz.b64 > /tmp/cscsecuritycam.tar.xz
          echo "83d243f5493948b985e005bccc357de068fd83f0a305d9bf56bda76af16b2922  /tmp/cscsecuritycam.tar.xz" | sha256sum --check
          tar -tJf /tmp/cscsecuritycam.tar.xz >/dev/null
          tar -xJf /tmp/cscsecuritycam.tar.xz -C . --strip-components=1
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -d app/src/main/java

      - name: Remove transfer fragments and commit imported Android source
        run: |
          rm -rf .import
          rm -f IMPORT_ZIP_TRIGGER.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CSCSecurityCam Android source"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle compatible with Android Gradle Plugin 9.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSCSecurityCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
