name: Import CSCSecurityCam ZIP and build APK

on:
  push:
    branches:
      - 'validation/cscsecuritycam-20261110'
    paths:
      - 'cscsecuritycam.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    name: Extract Android project and build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Validate supplied ZIP or confirm project is already imported
        run: |
          if [ -f cscsecuritycam.zip ]; then
            unzip -t cscsecuritycam.zip
            mkdir -p /tmp/cscsecuritycam-source
            unzip -q cscsecuritycam.zip -d /tmp/cscsecuritycam-source
            test -f /tmp/cscsecuritycam-source/app/build.gradle.kts
            test -f /tmp/cscsecuritycam-source/settings.gradle.kts
            test -f /tmp/cscsecuritycam-source/gradle/libs.versions.toml
          else
            echo "ZIP already imported; checking project tree."
            test -f app/build.gradle.kts
            test -f settings.gradle.kts
            test -f gradle/libs.versions.toml
          fi

      - name: Import supplied project into branch when ZIP is present
        run: |
          if [ -f cscsecuritycam.zip ]; then
            rm -rf app gradle public .aistudio
            rm -f build.gradle.kts settings.gradle.kts gradle.properties .gitignore .env.example README.md metadata.json
            cp -a /tmp/cscsecuritycam-source/. .
            rm -f cscsecuritycam.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Import supplied CSCSecurityCam Android project"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
          else
            echo "Project was already imported; no replacement required."
          fi
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSCSecurityCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
